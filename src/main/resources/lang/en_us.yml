# Every message is a plain MiniMessage string. All standard tags work here:
#   <b> <i> <u> <strikethrough> <br> <gradient:...> <shadow:...> <click:run_command:...> <click:open_url:...> <click:copy_to_clipboard:...> <hover:show_text:...> ... (https://docs.advntr.dev/minimessage/format.html)
#
# Wake color tags you can recolor in the `colors` section below:
#   <primary>     highlights, success values, counts
#   <secondary>   accents, [Button] chips
#   <accent>      names, identifiers, echoed user input
#   <overridden>  values shadowed by another OBU context
#   <info>        hint chips, notices
#   <danger>      errors, destructive results
#   <neutral>     body text
#   <muted>       arrows, separators, bullets, » prefix
#   <muted_dark>  empty states
#
# Palette variables for tags that expect the hex code of a color tag: $primary $secondary $accent $overridden $info $danger $neutral $muted $muted_dark
#   <gradient:$secondary:$primary>...</gradient>
#
# Dynamic placeholders are filled by the plugin per message and only work in the message they already appear in (moving them to other keys does nothing):
#   <alias> <aliases> <amount> <axis> <block> <blocks> <boat> <button> <code> <command> <confirm_btn> <context> <cooldown> <count> <delay> <description> <duration> <early_out> <entry> <error> <hint> <input> <literal> <module> <name> <padding> <sandbox> <sandboxes> <server> <setting> <source> <sub> <subcommands> <target> <total> <value> <variant> <x> <y> <z>
#
# <prefix> inserts the `prefix` value you can modify below
# ─────────────────────────────────────────────────────────────────────────────
