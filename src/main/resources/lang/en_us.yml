# Every message is a MiniMessage string. All standard tags work here:
#   <b> <i> <u> <strikethrough> <newline> <gradient:...> <click:run_command:...> <click:open_url:...> <click:copy_to_clipboard:...> <hover:show_text:...> ... (https://docs.advntr.dev/minimessage/format.html)
#
# Wake color tags (WakeColors.java):
#   <primary>     #33B5FF  highlights, success values
#   <secondary>   #5C66FF  headers and the [Wake] prefix
#   <accent>      #95A5FF  names, identifiers, echoed user input
#   <danger>      #FF5252  errors and destructive results
#   <neutral>     #CCCCCC  body text
#   <info>        #4DD0E1  hints and notices
#   <muted_dark>  #666666  empty states, de-emphasized rows
#   <overridden>  #AA55FF  values shadowed by another context
#
# Dynamic placeholders are filled by the plugin per message and only work in the message they already appear in (moving them to other keys does nothing):
#   <amount> <block> <blocks> <boat> <button> <code> <context> <count> <delay> <duration> <error> <hitbox> <input> <module> <name> <sandbox> <setting> <source> <target> <value> <variant> <x> <y> <z>
#
# <prefix> inserts the `prefix` value you can modify below
# ─────────────────────────────────────────────────────────────────────────────
