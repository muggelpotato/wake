id: no-adhoc-minimessage
language: Java
severity: warning
message: Ad-hoc MiniMessage deserialization — route player-facing text through MessageManager.
note: |
  CLAUDE.md (Text): never build Components ad hoc. Use
  `plugin.getMessageManager().send(sender, "dotted.key", ...)` with the string in
  lang/en_us.yml, so the text stays localized and themeable.
ignores:
  # The message manager is the one place allowed to deserialize MiniMessage.
  - "**/MessageManager.java"
# Any receiver, `MiniMessage.miniMessage()` included. MessageManager parses; it exposes no route for
# anyone else to, so there is no exception to carve out.
rule:
  pattern: $MM.deserialize($$$)
