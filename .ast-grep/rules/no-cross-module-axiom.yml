id: no-cross-module-axiom
language: Java
severity: error
message: Cross-module reach into axiom internals — communicate via events or the service registry.
note: |
  CLAUDE.md (Architecture 1): a module never reaches into another module's internals. axiom is an
  optional AxiomPaper integration and publishes no api/ surface today, so other modules must reach
  it only by firing/observing events or resolving a registered service — never by importing its
  classes. If axiom later publishes a surface, put it in `features/axiom/api/` (already exempted
  here). Only the composition root (Wake.java) may name the concrete AxiomModule to register it.
ignores:
  # Intra-module imports are unrestricted — a module owns its own internals.
  - "**/features/axiom/**"
  # The composition root wires modules by concrete class.
  - "**/Wake.java"
rule:
  all:
    - kind: import_declaration
    - regex: 'dev\.muggel\.wake\.features\.axiom\.'
    - not:
        regex: 'dev\.muggel\.wake\.features\.axiom\.api\.'