# whatever floats your boat
language: en_us
modules:
  base:
    enabled: true
  obu:
    enabled: true
  drydock:
    enabled: true
  axiom:
    enabled: false
database:
  type: "sqlite" # sqlite, mariadb
  host: "localhost"
  port: 3306
  database: "wake"
  username: "root"
  password: "password"
  pool:
    maximum_connections: 5
    minimum_idle: 1
sync: # cross-server cache invalidation via Valkey pub-sub (requires shared mariadb/valkey instance)
  enabled: false
  verbose_logging: false
  redis:
    host: "localhost"
    port: 6379
    password: ""