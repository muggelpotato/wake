# Every message is a plain MiniMessage string. All standard tags work here:
#   <b> <i> <u> <strikethrough> <br> <gradient:...> <shadow:...> <click:run_command:...> <click:open_url:...> <click:copy_to_clipboard:...> <hover:show_text:...> ... (https://docs.advntr.dev/minimessage/format.html)
#
# Wake color tags (WakeColors.java):
#   <primary>     #33B5FF  highlights, success values, counts
#   <secondary>   #5C66FF  accents, [Button] chips
#   <accent>      #95A5FF  names, identifiers, echoed user input
#   <overridden>  #AA55FF  values shadowed by another OBU context
#   <info>        #4DD0E1  hint chips, notices
#   <danger>      #FF5252  errors, destructive results
#   <neutral>     #C9CEE4  body text
#   <muted>       #8B92BD  arrows, separators, bullets, » prefix
#   <muted_dark>  #62678C  empty states
#
# Palette variables for tags that expect the hex code of a color tag: $primary $secondary $accent $overridden $info $danger $neutral $muted $muted_dark
#   <gradient:$secondary:$primary>...</gradient>
#
# Dynamic placeholders are filled by the plugin per message and only work in the message they already appear in (moving them to other keys does nothing):
#   <aliases> <amount> <block> <blocks> <boat> <button> <code> <command> <context> <count> <delay> <description> <duration> <error> <input> <module> <name> <padding> <sandbox> <setting> <source> <sub> <subcommands> <target> <value> <variant> <x> <y> <z>
#
# <prefix> inserts the `prefix` value you can modify below
# ─────────────────────────────────────────────────────────────────────────────
