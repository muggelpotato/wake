id: no-raw-scheduler
language: Java
severity: error
message: Raw Bukkit scheduler call — schedule through Scheduling so a shutdown mid-submit cannot throw.
note: |
  CLAUDE.md (Threading): Wake schedules from packet threads, the database writer thread and its own
  async tasks, all of which can still be running while the server stops. Bukkit answers a task
  submitted after that with IllegalPluginAccessException, and the isEnabled() check that would avoid
  it can never be airtight — the plugin can be disabled between the check and the submit. Both halves
  live in `Scheduling.onMain/async/laterAsync`, so no caller has to remember either. Hand-rolling the
  hop again is exactly how one of the two guards goes missing; add a variant to Scheduling instead.
ignores:
  # The helper itself: the one place the raw scheduler belongs.
  - "**/core/Scheduling.java"
  # Repeating purge sweep — needs the BukkitTask handle back to cancel it on disable, and is only
  # ever scheduled from module enable/reload, never while the plugin is going down.
  - "**/SandboxPurger.java"
rule:
  pattern: $RECEIVER.getScheduler().$METHOD($$$)
constraints:
  METHOD:
    regex: '^runTask'
