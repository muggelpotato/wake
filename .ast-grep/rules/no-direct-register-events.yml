id: no-direct-register-events
language: Java
severity: warning
message: Direct registerEvents — use WakeModule.registerListener so it auto-unregisters.
note: |
  CLAUDE.md (Architecture 3): `registerListener`/`registerPacketListener` unregister
  automatically on module disable. Registering directly leaks the listener when the module is
  toggled off. The sanctioned exception is a listener that self-registers conditionally for
  performance — it must own an `unregister()` that `onModuleDisable` calls.
ignores:
  # The registration helper is the one place that must call Bukkit directly.
  - "**/core/module/WakeModule.java"
  # Conditional self-registration for a hot event; owns its own unregister().
  - "**/BoostpadDetectorListener.java"
  # Records player moves only while a feature claims it; release() unregisters, called from the consumer's unregister().
  - "**/VehiclePath.java"
  # Core plumbing that outlives every module: the outage notice must reach players with base disabled.
  # Unregisters itself in shutdown().
  - "**/DatabaseManager.java"
  # The plugin's own bootstrap: core listeners live as long as Wake does and Bukkit drops them on disable.
  - "**/Wake.java"
rule:
  pattern: $P.getPluginManager().registerEvents($$$)
