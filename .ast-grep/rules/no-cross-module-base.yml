id: no-cross-module-base
language: Java
severity: error
message: Cross-module reach into base internals — communicate via events or the service registry.
note: |
  CLAUDE.md (Architecture 1): a module never reaches into another module's internals. base
  publishes no api/ surface today, so other modules must reach it only by firing/observing events
  or resolving a registered service — never by importing its classes. If base later publishes a
  surface, put it in `features/base/api/` (already exempted here). Only the composition root
  (Wake.java) may name the concrete BaseModule to register it.
ignores:
  # Intra-module imports are unrestricted — a module owns its own internals.
  - "**/features/base/**"
  # The composition root wires modules by concrete class.
  - "**/Wake.java"
rule:
  all:
    - kind: import_declaration
    - regex: 'dev\.muggel\.wake\.features\.base\.'
    - not:
        regex: 'dev\.muggel\.wake\.features\.base\.api\.'